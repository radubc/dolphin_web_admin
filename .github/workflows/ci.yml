name: CI

# Runs on every pull request into a long-lived branch. It never deploys
# anything and never touches a real database — it only proves the app
# type-checks, lints and builds into a Docker image.
on:
  pull_request:
    branches: [develop, stage, production, main]

# A new push to the same PR supersedes the run in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Harmless placeholders, not real databases. `prisma.config.ts` and
    # `prisma-admin.config.ts` read `DATABASE_URL` / `ADMIN_DATABASE_URL`
    # through the `prisma/config` `env()` helper, which throws immediately if
    # the variable is unset — even for `prisma generate`, which never opens a
    # connection. See the matching comment in the Dockerfile.
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      ADMIN_DATABASE_URL: postgresql://build:build@localhost:5432/build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the real Dockerfile end to end (deps → generate → build) to
      # catch anything that only breaks inside the container — e.g. a file
      # missing from the build context — without pushing an image anywhere.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_ID=${{ github.sha }}
          # Dummy key, generated once with `openssl rand -base64 32` and
          # pasted literally here — CI never pushes or runs this image, so
          # there's no canary-deployment consistency requirement to satisfy.
          # It only needs to be a valid base64 32-byte value so `npm run
          # build` (see the Dockerfile) doesn't fail. Not the real secret
          # used by the deploy workflow.
          secrets: |
            next_actions_key=wTPB5i+qihDJfgATqlWFaOA8TidNkxAFS22DZlUYiGs=
